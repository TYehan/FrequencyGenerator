<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="resources\FrequencyGenerator.css" />
    <script src="resources\FrequencyGenerator.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <title>Frequency Generator</title>
  </head>

  <body onload="script()" >
    <h3><yl>Frequency</yl> Generator <span>Hz</span></h3>
    <form>
      <input id="freqText" type="number" value="202" min="0" maxlengh="5" onchange="updateFreq(this.value)"/>
    </form>
    <br/>

    <div id="audioControls">
      <input id="om"type="button" value="÷2" onclick="updateFreq(freq / 2)"/>
      <input id="m"type="button" value="-1" onclick="updateFreq(freq - 1)"/>
      <input id="toggle" type="button" value="▶️" onclick="toggle()"/>
      <input id="p" type="button" value="+1" onclick="updateFreq(freq + 1)"/>
      <input id="op" type="button" value="×2" onclick="updateFreq(freq * 2)"/>
      <br>
    </div>

    <br/>

    <h1 style="color:white;"><u>Presets</u></h1>
    <p style="color:white;">Click on the buttons to set the frequency to the corresponding preset.</p>
    <p style="color:#ffc400ff;">These presets are based on the Solfeggio Frequencies which believed to have healing properties.</p>
    <br/>
    <div id="presets" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;">
      <button id="water" onclick="updateFreq(newFreq = 165)">Speaker Water Remover</button>
      <button id="memry" onclick="updateFreq(newFreq = 40)">Memory Stimulation 🎧</button>
      <button id="balance" onclick="updateFreq(newFreq = 136.1)">Balance</button>
      <button id="harmony" onclick="updateFreq(newFreq = 174)">Harmony</button>
      <button id="heal" onclick="updateFreq(newFreq = 285)">Healing</button>
      <button id="peace" onclick="updateFreq(newFreq = 396)">Let go Fear & Negativity</button>
      <button id="connection" onclick="updateFreq(newFreq = 417)">Connection</button>
      <button id="happiness" onclick="updateFreq(newFreq = 432)">Happiness, Relaxation</button>
      <button id="love" onclick="updateFreq(newFreq = 528)">Love, Energy, Meditation</button>
      <button id="joy" onclick="updateFreq(newFreq = 540)">Joy</button>
      <button id="miracle" onclick="updateFreq(newFreq = 639)">Miracle</button>
      <button id="awakening" onclick="updateFreq(newFreq = 741)">Awakening</button>
      <button id="luck" onclick="updateFreq(newFreq = 777)">Luck</button>
      <button id="intuition" onclick="updateFreq(newFreq = 852)">Intuition</button>
      <button id="abundance" onclick="updateFreq(newFreq = 888)">Abundance, Prosperity, Wealth</button>
      <button id="spiritual" onclick="updateFreq(newFreq = 963)">Spiritual</button>
    </div>

    <div id="frequency">
    </div>

    <footer>
      <p>
        &copy;

    </footer>
  </body>
</html>
